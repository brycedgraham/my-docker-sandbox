# ==============================================================================
# OMP Coding Agent Models Configuration (models.yml)
# Documentation: https://omp.sh/docs
# ==============================================================================
# Configured for Local LLM inference via Unsloth (OpenAI-compatible vLLM server)
#
# Host Setup Guide:
#   To serve a model on your host GPU with Unsloth / vLLM, run:
#     vllm serve unsloth/Qwen2.5-Coder-32B-Instruct --port 8000 --host 0.0.0.0
#   or for DeepSeek reasoning:
#     vllm serve unsloth/DeepSeek-R1-Distill-Qwen-32B --port 8000 --host 0.0.0.0
#
# Inside Docker containers:
#   `http://host.docker.internal:8000/v1` connects directly to the host machine.
# ==============================================================================

providers:
  unsloth:
    name: "Local Unsloth Server"
    baseUrl: "http://host.docker.internal:8000/v1"
    apiKey: "not-needed" # Local server doesn't enforce API auth
    api: "openai-completions"
    models:
      - id: "unsloth/Qwen2.5-Coder-32B-Instruct"
        name: "Qwen 2.5 Coder 32B (Unsloth)"
        contextWindow: 131072
        maxTokens: 16384
        pricing:
          inputCostPerMillion: 0.0
          outputCostPerMillion: 0.0
        reasoning: false

      - id: "unsloth/DeepSeek-R1-Distill-Qwen-32B"
        name: "DeepSeek R1 Distill Qwen 32B (Unsloth)"
        contextWindow: 65536
        maxTokens: 16384
        pricing:
          inputCostPerMillion: 0.0
          outputCostPerMillion: 0.0
        reasoning: true

      - id: "unsloth/Llama-3.3-70B-Instruct"
        name: "Llama 3.3 70B Instruct (Unsloth)"
        contextWindow: 131072
        maxTokens: 8192
        pricing:
          inputCostPerMillion: 0.0
          outputCostPerMillion: 0.0
        reasoning: false

      - id: "default"
        name: "Default Local Unsloth Model"
        contextWindow: 131072
        maxTokens: 16384
        pricing:
          inputCostPerMillion: 0.0
          outputCostPerMillion: 0.0
        reasoning: false

