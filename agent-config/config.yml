# ==============================================================================
# OMP Harness Configuration (config.yml)
# Documentation: https://omp.sh/docs
# ==============================================================================
# Maps agent roles to specific Unsloth local models or roles

roles:
  default: "unsloth/Qwen2.5-Coder-32B-Instruct"
  plan: "unsloth/DeepSeek-R1-Distill-Qwen-32B"
  slow: "unsloth/Qwen2.5-Coder-32B-Instruct"
  task: "unsloth/Qwen2.5-Coder-32B-Instruct"
  smol: "unsloth/Qwen2.5-Coder-32B-Instruct"
  advisor: "unsloth/DeepSeek-R1-Distill-Qwen-32B"

# Harness behavior
autoSummary: true
maxIterations: 60
gitTracking: true
editor: "hashline"
thinkingEffort: "medium"
